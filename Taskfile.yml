version: "3"

# Developer shortcuts for the openats CLI and quality checks.
# Usage: task --list
# Pass extra CLI arguments after `--`, e.g. `task collect:ats -- ashby lever`.

vars:
  UV: uv
  CLI: uv run openats

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  setup:
    desc: Install dependencies, migrate the database, and load seed data
    cmds:
      - "{{.UV}} sync --extra dev"
      - task: db:init
      - |
        count=$(.venv/bin/python -c "import sqlite3; print(sqlite3.connect('data/database.db').execute('SELECT COUNT(*) FROM companies').fetchone()[0])")
        watchlists=$(.venv/bin/python -c "import sqlite3; print(sqlite3.connect('data/database.db').execute('SELECT COUNT(*) FROM watchlists').fetchone()[0])")
        if [ "$count" -eq 0 ]; then
          {{.CLI}} load database
        elif [ "$watchlists" -eq 0 ]; then
          {{.CLI}} watchlist load data/parquet/watchlists
        else
          echo "Database already has $count companies and $watchlists watchlist entries; skipping seed load"
        fi

  update:
    desc: Upgrade locked dependencies and sync the environment
    cmds:
      - "{{.UV}} lock --upgrade"
      - "{{.UV}} sync --extra dev"

  # --- Background pipeline --------------------------------------------------

  start:
    desc: Start the collection pipeline in the background
    cmds:
      - |
        count=$(.venv/bin/python -c "import sqlite3; print(sqlite3.connect('data/database.db').execute('SELECT COUNT(*) FROM companies').fetchone()[0])" 2>/dev/null || echo 0)
        if [ "$count" -eq 0 ]; then
          echo "Database is not ready. Run 'task setup' first." >&2
          exit 1
        fi
        if pgrep -f '[.]venv/bin/openats' >/dev/null 2>&1; then
          echo "openats is already running. Run 'task dev' to follow output."
          exit 0
        fi
        mkdir -p .run
        nohup setsid sh -c 'echo $$ > .run/openats.pid; exec .venv/bin/openats' > .run/openats.log 2>&1 < /dev/null &
        sleep 1
        pid=$(cat .run/openats.pid 2>/dev/null || true)
        if [ -z "$pid" ] || ! ps -p "$pid" -o args= 2>/dev/null | grep -q '[.]venv/bin/openats'; then
          rm -f .run/openats.pid
          echo "openats failed to start. Recent output:" >&2
          tail -n 20 .run/openats.log >&2 || true
          exit 1
        fi
        echo "openats started (pid $pid). Run 'task dev' to follow output."

  stop:
    desc: Stop the running pipeline, if any
    cmds:
      - |
        pid=$(cat .run/openats.pid 2>/dev/null || true)
        if [ -n "$pid" ] && ps -p "$pid" -o args= 2>/dev/null | grep -q '[.]venv/bin/openats'; then
          /bin/kill "$pid" 2>/dev/null || true
        fi
        pkill -f '[.]venv/bin/openats' 2>/dev/null || true
        rm -f .run/openats.pid
        echo "openats stopped"

  dev:
    desc: Follow the running pipeline's stdout output
    cmds:
      - |
        if [ ! -f .run/openats.log ]; then
          echo "No log found. Run 'task start' first." >&2
          exit 1
        fi
        tail -n 200 -F .run/openats.log

  # --- Quality checks -------------------------------------------------------

  lint:
    desc: Lint source code with ruff
    cmds:
      - "{{.UV}} run ruff check src/"

  pylint:
    desc: Run pylint checks
    cmds:
      - "{{.UV}} run pylint src/"

  typecheck:
    desc: Type-check source code with mypy
    cmds:
      - "{{.UV}} run mypy src/"

  format:
    desc: Format source code with ruff
    cmds:
      - "{{.UV}} run ruff format src/"

  format:check:
    desc: Verify formatting without editing files
    cmds:
      - "{{.UV}} run ruff format src/ --check"

  fix:
    desc: Auto-fix lint issues and format source code
    cmds:
      - "{{.UV}} run ruff check src/ --fix"
      - "{{.UV}} run ruff format src/"

  test:
    desc: 'Run the test suite (extra args: task test -- -k pattern)'
    cmds:
      - "{{.UV}} run pytest {{.CLI_ARGS}}"

  check:
    desc: Run all CI checks (format, lint, types, tests)
    cmds:
      - task: format:check
      - task: lint
      - task: typecheck
      - task: test

  # --- Database -------------------------------------------------------------

  db:init:
    desc: Create or reinitialize the database schema
    cmds:
      - "{{.CLI}} database"

  db:load:
    desc: Load company and watchlist seed data from Parquet
    cmds:
      - "{{.CLI}} load database"

  db:reset:
    desc: Reinitialize the database and reload seed data
    cmds:
      - task: db:init
      - task: db:load

  # --- Collection -----------------------------------------------------------

  collect:
    desc: Run the continuous collection pipeline
    cmds:
      - "{{.CLI}}"

  collect:all:
    desc: 'Collect all companies (extra args: task collect:all -- --skip meta)'
    cmds:
      - "{{.CLI}} collect {{.CLI_ARGS}}"

  collect:ats:
    desc: Collect ATS types, e.g. task collect:ats -- ashby lever
    cmds:
      - "{{.CLI}} collect ats {{.CLI_ARGS}}"

  collect:company:
    desc: Collect companies by name or slug, e.g. task collect:company -- openai
    cmds:
      - "{{.CLI}} collect company {{.CLI_ARGS}}"

  collect:watchlist:
    desc: Collect one or all watchlists, e.g. task collect:watchlist -- ai
    cmds:
      - "{{.CLI}} collect watchlist {{.CLI_ARGS}}"

  # --- Dump -----------------------------------------------------------------

  dump:recent:
    desc: Export jobs posted in the last 24 hours
    cmds:
      - "{{.CLI}} dump recent jobs"

  dump:ats:
    desc: Export jobs by ATS (default all), e.g. task dump:ats -- ashby
    cmds:
      - "{{.CLI}} dump ats {{.CLI_ARGS}}"

  dump:company:
    desc: Export jobs by company (default all), e.g. task dump:company -- openai
    cmds:
      - "{{.CLI}} dump company {{.CLI_ARGS}}"

  dump:companies:
    desc: Export the company directory to companies.parquet
    cmds:
      - "{{.CLI}} dump companies-table"

  dump:watchlists:
    desc: Export the watchlist table to watchlists.parquet
    cmds:
      - "{{.CLI}} dump watchlist-table"

  dump:watchlist:
    desc: Export watchlist jobs (default all), e.g. task dump:watchlist -- ai
    cmds:
      - "{{.CLI}} dump watchlist {{.CLI_ARGS}}"

  # --- Watchlist ------------------------------------------------------------

  watchlist:list:
    desc: List available watchlist titles
    cmds:
      - "{{.CLI}} watchlist list"

  watchlist:load:
    desc: Load watchlists from a Parquet directory, e.g. task watchlist:load -- data/parquet/watchlists
    cmds:
      - "{{.CLI}} watchlist load {{.CLI_ARGS}}"

  # --- Validation and discovery --------------------------------------------

  validate:jobs:
    desc: 'Remove jobs whose URLs return 404/410 (extra args: --dry-run, --workers N)'
    cmds:
      - "{{.CLI}} validate jobs {{.CLI_ARGS}}"

  validate:companies:
    desc: 'Remove companies whose URLs return 404/410 (extra args: --dry-run, --workers N)'
    cmds:
      - "{{.CLI}} validate companies {{.CLI_ARGS}}"

  remove:unwatched:
    desc: 'Remove companies outside all watchlists (extra args: --dry-run)'
    cmds:
      - "{{.CLI}} remove unwatched {{.CLI_ARGS}}"

  discover:
    desc: 'Discover companies on ATS platforms (extra args: --ats ashby, --dry-run)'
    cmds:
      - "{{.CLI}} discover {{.CLI_ARGS}}"

  # --- Maintenance ----------------------------------------------------------

  clean:
    desc: Remove local Python and tool caches
    cmds:
      - rm -rf .pytest_cache .ruff_cache .mypy_cache
      - find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
